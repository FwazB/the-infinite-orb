[package]
name = "infinite-orb"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
glam = "=0.34.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["Window", "Document", "Element", "Node", "NodeList", "HtmlElement", "CssStyleDeclaration", "HtmlCanvasElement", "HtmlInputElement", "HtmlSelectElement", "HtmlButtonElement", "HtmlProgressElement", "Event", "EventTarget", "KeyboardEvent", "PointerEvent", "PageTransitionEvent", "Performance", "MediaQueryList", "Location", "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer", "WebGlVertexArrayObject", "WebGlUniformLocation", "AudioContext", "AudioContextState", "BaseAudioContext", "AudioDestinationNode", "AudioNode", "AudioParam", "AudioBuffer", "AudioBufferSourceNode", "AudioScheduledSourceNode", "GainNode", "BiquadFilterNode", "BiquadFilterType", "AnalyserNode", "console"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
